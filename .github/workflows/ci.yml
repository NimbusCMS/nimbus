name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nimbus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, gd, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Formatting and static analysis run before the tests: fast, no database,
      # and a good place to fail early.
      - name: Formatting
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '3306'
          TEST_DB_NAME: nimbus_test
          TEST_DB_USER: root
          TEST_DB_PASS: root

      # Installs from an empty database and drives real CRUD against the shipped
      # entry point — the one thing the test suite cannot prove on its own.
      - name: Smoke test (install + CRUD)
        run: tests/smoke.sh
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: nimbus_smoke
          DB_USER: root
          DB_PASS: root

      # Installs the official Markdown plugin through real Composer resolution
      # and drives its whole lifecycle across the package boundary. Proves the
      # two repositories work as independently packaged software.
      - name: Package-boundary test (Composer install + Markdown lifecycle)
        run: tests/Integration/package-boundary.sh
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: nimbus_pkg
          DB_USER: root
          DB_PASS: root
          PLUGIN_REPO: https://github.com/NimbusCMS/plugin-markdown
          PLUGIN_REF: main

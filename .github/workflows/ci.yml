name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The full suite runs across the supported PHP range (composer.json requires
    # >=8.2). 8.2..8.4 are required; the next release is tested as a non-blocking
    # early warning so an incompatibility surfaces before it is promoted. The
    # php-freshness workflow flags when a newer PHP appears or one nears EOL.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        include:
          - php: '8.5'
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nimbus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, gd, mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Fail on a known advisory in the committed lockfile. `--locked` audits
      # exactly what ships (not a fresh resolve); `--abandoned=report` pins the
      # policy so a dependency becoming abandoned warns without breaking CI on a
      # Composer version bump (Composer >= 2.7 fails by default). Dev tooling is
      # in scope on purpose — it runs arbitrary code in CI and on contributors'
      # machines, so `--no-dev` is deliberately not used.
      - name: Dependency audit
        run: composer audit --locked --abandoned=report

      # Formatting and static analysis run before the tests: fast, no database,
      # and a good place to fail early.
      - name: Formatting
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '3306'
          TEST_DB_NAME: nimbus_test
          TEST_DB_USER: root
          TEST_DB_PASS: root

      # Installs from an empty database and drives real CRUD against the shipped
      # entry point — the one thing the test suite cannot prove on its own.
      - name: Smoke test (install + CRUD)
        run: tests/smoke.sh
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: nimbus_smoke
          DB_USER: root
          DB_PASS: root

      # Installs the official Markdown plugin through real Composer resolution
      # and drives its whole lifecycle across the package boundary. Proves the
      # two repositories work as independently packaged software.
      - name: Package-boundary test (Composer install + Markdown lifecycle)
        run: tests/Integration/package-boundary.sh
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: nimbus_pkg
          DB_USER: root
          DB_PASS: root
          PLUGIN_REPO: https://github.com/NimbusCMS/plugin-markdown
          PLUGIN_REF: main

  # Stable required status check ("tests"): green only when every required PHP
  # matrix leg passed. The 8.5 early-warning leg is continue-on-error, so a
  # failure there never blocks this gate. Branch protection requires this context.
  tests:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the PHP matrix to pass
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "A required PHP matrix job failed (see the 'test' jobs)."
            exit 1
          fi
          echo "All required PHP matrix jobs passed."
